# pnpm 11 reads project settings from here (not package.json's "pnpm" field).
#
# sharp is Next 16's image-optimization engine and legitimately needs its
# native binary built on install.
onlyBuiltDependencies:
  - sharp
# Skip pnpm's pre-run dependency verification, which can otherwise abort
# `pnpm run <script>` on machines with strict build-script policies.
verifyDepsBeforeRun: false
#
# Security overrides for vulnerable, mostly-transitive dependencies. Each entry
# is scoped to the vulnerable version range so unrelated majors already in the
# tree are left untouched. The `next` (14 -> 16) and `ai` (3 -> 5) major upgrades
# are intentionally NOT here — they are handled in their own PRs.
overrides:
  form-data@<4.0.4: ^4.0.4
  lodash@<4.17.23: ^4.17.23
  lodash-es@<4.17.23: ^4.17.23
  fast-uri@<3.1.1: ^3.1.1
  js-yaml@<4.3.1: ^4.3.1
  diff@>=4.0.0 <4.0.4: ^4.0.4
  mdast-util-to-hast@<13.2.1: ^13.2.1
  micromatch@<4.0.8: ^4.0.8
  picomatch@<2.3.2: ^2.3.2
  yaml@<2.8.3: ^2.8.3
  flatted@<3.4.0: ^3.4.0
  nanoid@<3.3.17: ^3.3.17
  cross-spawn@<7.0.5: ^7.0.5
  '@babel/runtime@<7.26.10': ^7.26.10
  postcss@<8.5.23: ^8.5.23
  glob@>=10.2.0 <10.5.0: ^10.5.0
  brace-expansion@>=1.0.0 <1.1.16: ^1.1.16
  brace-expansion@>=2.0.0 <2.1.2: ^2.1.2
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  minimatch@>=3.0.0 <3.1.3: ^3.1.3
  minimatch@>=9.0.0 <9.0.6: ^9.0.6
  ajv@>=6.0.0 <6.14.0: ^6.14.0
  ajv@>=8.0.0 <8.18.0: ^8.18.0
  undici@>=7.0.0 <7.29.0: ^7.29.0
  sharp@<0.35.0: ^0.35.0
