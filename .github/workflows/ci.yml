name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN: both jobs only read the repo (no
# deploy, no writes back). Widen per-job if a future job needs more.
permissions:
  contents: read

jobs:
  build:
    name: Lint & build (explorer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer

    # The API routes validate these at module load, so `next build` needs them
    # set. These are dummy, non-secret placeholders that satisfy the presence
    # checks without connecting to anything — the build makes no network calls.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: dummy
      MONGODB_USERNAME: dummy
      MONGODB_PASSWORD: dummy
      MONGODB_HOST: localhost
      MONGODB_DATABASE: dummy
      OPENAI_API_KEY: sk-dummy
      PINECONE_API_KEY: dummy-key

    steps:
      - uses: actions/checkout@v7

      # Version comes from the "packageManager" field in explorer/package.json.
      - uses: pnpm/action-setup@v6.0.9
        with:
          package_json_file: explorer/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: explorer/pnpm-lock.yaml

      # --ignore-scripts: sharp (Next 16's image optimizer) ships prebuilt
      # platform binaries via its @img/sharp-* optional deps, so its install
      # script isn't needed, and `next build` doesn't invoke sharp. Skipping
      # scripts also avoids the runner's supply-chain policy failing the install
      # on the otherwise-harmless blocked sharp build script.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  python:
    name: Lint & smoke-check (python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      # Full install (not just ruff) so a bad dependency bump that fails to
      # resolve/install is caught here — this lane is the safety net for the
      # Python dependency work. --no-root: the repo is a script collection, not
      # an installable package.
      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Lint
        run: poetry run ruff check .

      # The data scripts run service connections at module load (and import
      # optional-at-runtime deps), so importing them isn't safe in CI. Byte-
      # compilation catches syntax/AST breakage — e.g. from a dependency bump —
      # without executing anything.
      - name: Compile smoke check
        run: poetry run python -m compileall process.py process_scotus.py
