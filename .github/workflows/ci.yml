name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build (explorer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer

    # The API routes validate these at module load, so `next build` needs them
    # set. These are dummy, non-secret placeholders that satisfy the presence
    # checks without connecting to anything — the build makes no network calls.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: dummy
      MONGODB_USERNAME: dummy
      MONGODB_PASSWORD: dummy
      MONGODB_HOST: localhost
      MONGODB_DATABASE: dummy
      OPENAI_API_KEY: sk-dummy
      PINECONE_API_KEY: dummy-key

    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in explorer/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: explorer/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: explorer/pnpm-lock.yaml

      # --ignore-scripts: sharp (Next 16's image optimizer) ships prebuilt
      # platform binaries via its @img/sharp-* optional deps, so its install
      # script isn't needed, and `next build` doesn't invoke sharp. Skipping
      # scripts also avoids the runner's supply-chain policy failing the install
      # on the otherwise-harmless blocked sharp build script.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
